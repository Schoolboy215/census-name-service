openapi: 3.0.0
info:
  version: 1.0.0
  title: Census names
  description: >
    
    API that generates realistic American names from public census bureau and
    social security administration data


    ## Percentile filtering

    Percentile represents how much of the distribution to use, and top
    represents whether this distribution is at the most common end (true) or
    least common end (false). To put it into simple terms with an example,
    requesting top="true", percentile=20 is equivalent to asking for a name that
    is in the top 20% most common names.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Only required if the server is configured with
        REQUIRE_API_KEYS=true. Doesn't apply to same-origin requests from the
        site.
  schemas: {}
  parameters: {}
paths:
  /api/firstName:
    post:
      description: Get a random first name with optional filters for sex, year of
        birth, and state as well as rarity.
      summary: Get a random first name.
      security:
        - ApiKeyAuth: []
        - {}
